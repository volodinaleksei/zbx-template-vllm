zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
      name: Templates/Applications
  templates:
    - uuid: 5a4a0e6467504d9cad8cfbf615e018a3
      template: vLLM
      name: vLLM
      description: 'vLLM (OpenAI-compatible) server: Prometheus /metrics, /health and {$VLLM.TEST.PATH} checks.'
      groups:
        - name: Templates/Applications
      items:
        - uuid: 004cf3560e8d483da51f1d6fadcb3098
          name: 'vLLM: API port'
          type: SIMPLE
          key: 'net.tcp.service[http,,{$VLLM.PORT}]'
          history: 90d
        - uuid: 7a51558a54124953a1339daec8cf8bce
          name: 'Server responds (/health)'
          type: DEPENDENT
          key: vllm.health
          history: 7d
          value_type: FLOAT
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return 1;'
          master_item:
            key: vllm.health.raw
          triggers:
            - uuid: a9c4ba048e61472a9b9096801a68ed24
              expression: 'max(/vLLM/vllm.health,5m)=0'
              name: '/health endpoint unavailable for 5 minutes. Check the vLLM process on the host.'
              event_name: 'vLLM: server does not respond (/health)'
              priority: DISASTER
        - uuid: f9bcc2071e6a49b8882a671b3bebe61d
          name: '/health raw response'
          type: HTTP_AGENT
          key: vllm.health.raw
          delay: 30s
          history: '0'
          value_type: TEXT
          timeout: 15s
          url: 'http://{HOST.CONN}:{$VLLM.PORT}/health'
        - uuid: 0815be3dc1024d36ade29656da7a57cb
          name: 'KV-cache usage'
          type: DEPENDENT
          key: vllm.kv_cache.usage
          history: 7d
          value_type: FLOAT
          units: '%'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'var m = /^vllm:kv_cache_usage_perc\{[^}]*\}\s+([0-9eE.+\-]+)$/m.exec(value); return m ? parseFloat(m[1]) * 100 : 0;'
          master_item:
            key: vllm.metrics.raw
          triggers:
            - uuid: 371e04a6c5d74815a952981e79fb9511
              expression: 'last(/vLLM/vllm.kv_cache.usage)>{$VLLM.KV.MAX}'
              name: 'KV-cache is nearly full — preemptions and admission rejections may occur.'
              event_name: 'vLLM: KV-cache > {$VLLM.KV.MAX}%'
              priority: WARNING
        - uuid: fe63ca45a5264f6a949ae5766743b172
          name: '/metrics raw response (Prometheus)'
          type: HTTP_AGENT
          key: vllm.metrics.raw
          history: '0'
          value_type: TEXT
          timeout: 15s
          url: 'http://{HOST.CONN}:{$VLLM.PORT}{$VLLM.METRICS.PATH}'
        - uuid: 5440f976bf2e42b891247e2dfa022b88
          name: 'Models loaded'
          type: DEPENDENT
          key: vllm.models.count
          history: 7d
          value_type: FLOAT
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'var d = JSON.parse(value); return d.data ? d.data.length : 0;'
          master_item:
            key: vllm.test.raw
          triggers:
            - uuid: 5c69b789c66444718cea3ab5353d7e8f
              expression: last(/vLLM/vllm.models.count)=0
              name: '/v1/models returned an empty model list.'
              event_name: 'vLLM: no models loaded'
              priority: AVERAGE
        - uuid: 4f997fcfbe1b4c2ab9cec65f95271b05
          name: 'Request preemptions'
          type: DEPENDENT
          key: vllm.preemptions
          history: 7d
          value_type: FLOAT
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'var re = /^vllm:num_preemptions_total\{[^}]*\}\s+([0-9eE.+\-]+)$/mg; var t = 0, m; while ((m = re.exec(value)) !== null) t += parseFloat(m[1]); return t;'
          master_item:
            key: vllm.metrics.raw
        - uuid: a0d7c93e44d649cfb19beeb2843b1858
          name: 'Process memory (RSS)'
          type: DEPENDENT
          key: vllm.process.rss
          history: 7d
          value_type: FLOAT
          units: bytes
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'var m = /^process_resident_memory_bytes\s+([0-9eE.+\-]+)$/m.exec(value); return m ? m[1] : 0;'
          master_item:
            key: vllm.metrics.raw
        - uuid: 247186c897cb4a2e8e51201736ff7aa7
          name: 'Requests in flight'
          type: DEPENDENT
          key: vllm.requests.running
          history: 7d
          value_type: FLOAT
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'var re = /^vllm:num_requests_running\{[^}]*\}\s+([0-9eE.+\-]+)$/mg; var t = 0, m; while ((m = re.exec(value)) !== null) t += parseFloat(m[1]); return t;'
          master_item:
            key: vllm.metrics.raw
        - uuid: 0da5e97a650d49b3a5d753b3cd305d10
          name: 'Requests queued'
          type: DEPENDENT
          key: vllm.requests.waiting
          history: 7d
          value_type: FLOAT
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'var re = /^vllm:num_requests_waiting\{[^}]*\}\s+([0-9eE.+\-]+)$/mg; var t = 0, m; while ((m = re.exec(value)) !== null) t += parseFloat(m[1]); return t;'
          master_item:
            key: vllm.metrics.raw
          triggers:
            - uuid: 939c480e5582425082279f47d5c176f9
              expression: 'avg(/vLLM/vllm.requests.waiting,5m)>{$VLLM.QUEUE.MAX}'
              name: 'Average request queue length is above the {$VLLM.QUEUE.MAX} threshold.'
              event_name: 'vLLM: request queue backlog (> {$VLLM.QUEUE.MAX})'
              priority: WARNING
        - uuid: 58a9f560453847399bc0852eeff1c39b
          name: 'API responds ({$VLLM.TEST.PATH})'
          type: DEPENDENT
          key: vllm.test
          history: 7d
          value_type: FLOAT
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return 1;'
          master_item:
            key: vllm.test.raw
        - uuid: b7988a7546694c7ba9070d197155ab3b
          name: '{$VLLM.TEST.PATH} raw response (API check)'
          type: HTTP_AGENT
          key: vllm.test.raw
          delay: 5m
          history: '0'
          value_type: TEXT
          timeout: 15s
          url: 'http://{HOST.CONN}:{$VLLM.PORT}{$VLLM.TEST.PATH}'
        - uuid: 470c9ee5f6a34f94b5c2ae25ee4d9bc1
          name: 'Generation tokens (total)'
          type: DEPENDENT
          key: vllm.tokens.generation
          history: 7d
          value_type: FLOAT
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'var re = /^vllm:generation_tokens_total\{[^}]*\}\s+([0-9eE.+\-]+)$/mg; var t = 0, m; while ((m = re.exec(value)) !== null) t += parseFloat(m[1]); return t;'
          master_item:
            key: vllm.metrics.raw
        - uuid: 4d82b69477cd40c0a91e46158fcd36ed
          name: 'Prompt tokens (total)'
          type: DEPENDENT
          key: vllm.tokens.prompt
          history: 7d
          value_type: FLOAT
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'var re = /^vllm:prompt_tokens_total\{[^}]*\}\s+([0-9eE.+\-]+)$/mg; var t = 0, m; while ((m = re.exec(value)) !== null) t += parseFloat(m[1]); return t;'
          master_item:
            key: vllm.metrics.raw
        - uuid: b525977132cd43e1af14c1fef2af754c
          name: 'Average TTFT'
          type: DEPENDENT
          key: vllm.ttft.avg
          history: 7d
          value_type: FLOAT
          units: s
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'var ss = 0, c = 0, m; var re1 = /^vllm:time_to_first_token_seconds_sum\{[^}]*\}\s+([0-9eE.+\-]+)$/mg; while ((m = re1.exec(value)) !== null) ss += parseFloat(m[1]); var re2 = /^vllm:time_to_first_token_seconds_count\{[^}]*\}\s+([0-9eE.+\-]+)$/mg; while ((m = re2.exec(value)) !== null) c += parseFloat(m[1]); return c > 0 ? ss / c : 0;'
          master_item:
            key: vllm.metrics.raw
      discovery_rules:
        - uuid: 826683cda7e344de84b9eb36487310e8
          name: 'vLLM models'
          type: DEPENDENT
          key: vllm.model.discovery
          item_prototypes:
            - uuid: 77feeb457e4a42eba5ffbce09277d96e
              name: 'Model {#MODELID} context size'
              type: DEPENDENT
              key: 'vllm.model.ctx[{#MODELID}]'
              history: 7d
              value_type: FLOAT
              units: tok
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - 'var d = JSON.parse(value).data.filter(function(m){return m.id === "{#MODELID}";}); return d.length && d[0].max_model_len ? d[0].max_model_len : 0;'
              master_item:
                key: vllm.test.raw
              trigger_prototypes:
                - uuid: e99588677e4f499e91ecda22fe474cad
                  expression: 'find(/vLLM/vllm.model.ctx[{#MODELID}],,"eq","0")=1'
                  name: 'Model {#MODELID} disappeared from /v1/models.'
                  event_name: 'vLLM: model {#MODELID} unloaded'
                  priority: AVERAGE
            - uuid: 5e8a2995e76448a59e1e7ce6c0b0c6d8
              name: '{#MODELID}: requests in flight'
              type: DEPENDENT
              key: 'vllm.model.run[{#MODELID}]'
              history: 7d
              value_type: FLOAT
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - 'var re = /^vllm:num_requests_running\{[^}]*model_name="{#MODELID}"[^}]*\}\s+([0-9eE.+\-]+)$/mg; var t = 0, m; while ((m = re.exec(value)) !== null) t += parseFloat(m[1]); return t;'
              master_item:
                key: vllm.metrics.raw
            - uuid: df59ed19c6f54824909e7e61fc07642c
              name: '{#MODELID}: successful requests'
              type: DEPENDENT
              key: 'vllm.model.success[{#MODELID}]'
              history: 7d
              value_type: FLOAT
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - 'var re = /^vllm:request_success_total\{[^}]*model_name="{#MODELID}"[^}]*\}\s+([0-9eE.+\-]+)$/mg; var t = 0, m; while ((m = re.exec(value)) !== null) t += parseFloat(m[1]); return t;'
              master_item:
                key: vllm.metrics.raw
            - uuid: cd7262db435b45a29e23a26b96fe9f0e
              name: '{#MODELID}: generation tokens'
              type: DEPENDENT
              key: 'vllm.model.tok.gen[{#MODELID}]'
              history: 7d
              value_type: FLOAT
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - 'var re = /^vllm:generation_tokens_total\{[^}]*model_name="{#MODELID}"[^}]*\}\s+([0-9eE.+\-]+)$/mg; var t = 0, m; while ((m = re.exec(value)) !== null) t += parseFloat(m[1]); return t;'
              master_item:
                key: vllm.metrics.raw
            - uuid: 47f23c8ea4e047cb98346a1f00325710
              name: '{#MODELID}: prompt tokens'
              type: DEPENDENT
              key: 'vllm.model.tok.prompt[{#MODELID}]'
              history: 7d
              value_type: FLOAT
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - 'var re = /^vllm:prompt_tokens_total\{[^}]*model_name="{#MODELID}"[^}]*\}\s+([0-9eE.+\-]+)$/mg; var t = 0, m; while ((m = re.exec(value)) !== null) t += parseFloat(m[1]); return t;'
              master_item:
                key: vllm.metrics.raw
            - uuid: 4e64d96aab324efdb862b44057e835f0
              name: '{#MODELID}: requests queued'
              type: DEPENDENT
              key: 'vllm.model.wait[{#MODELID}]'
              history: 7d
              value_type: FLOAT
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - 'var re = /^vllm:num_requests_waiting\{[^}]*model_name="{#MODELID}"[^}]*\}\s+([0-9eE.+\-]+)$/mg; var t = 0, m; while ((m = re.exec(value)) !== null) t += parseFloat(m[1]); return t;'
              master_item:
                key: vllm.metrics.raw
          master_item:
            key: vllm.test.raw
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'var d = JSON.parse(value).data; var out = []; for (var i = 0; i < d.length; i++) out.push({"{#MODELID}": d[i].id, "{#MODELROOT}": (d[i].root || d[i].id)}); return JSON.stringify(out);'
      macros:
        - macro: '{$VLLM.KV.MAX}'
          value: '90'
          description: 'Warning threshold: KV-cache usage, %'
        - macro: '{$VLLM.METRICS.PATH}'
          value: /metrics
          description: 'Prometheus metrics path'
        - macro: '{$VLLM.PORT}'
          value: '8000'
          description: 'vLLM server port'
        - macro: '{$VLLM.QUEUE.MAX}'
          value: '5'
          description: 'Warning threshold: request queue length'
        - macro: '{$VLLM.TEST.PATH}'
          value: /v1/models
          description: 'Functional check path'
      valuemaps:
        - uuid: e809cd3e43d74a2a86628409a625bb95
          name: 'Service state'
          mappings:
            - value: '0'
              newvalue: Down
            - value: '1'
              newvalue: Up
  triggers:
    - uuid: 6109bdfde82e42d1b5da533a89f58a83
      expression: 'max(/vLLM/vllm.test,5m)=0 and last(/vLLM/vllm.health)=1'
      name: '/health responds but {$VLLM.TEST.PATH} fails — server is up but cannot process requests.'
      event_name: 'vLLM: API not responding (/health alive)'
      priority: HIGH
    - uuid: 8050383bed1643d692883001c2b16434
      expression: 'last(/vLLM/net.tcp.service[http,,{$VLLM.PORT}])=0 and max(/vLLM/vllm.health,5m)>0'
      name: 'Service TCP port is closed while /health answered recently (server process died, not the network). A pure network/host outage will only fire ''server does not respond (/health)''.'
      event_name: 'vLLM: port {$VLLM.PORT} unreachable'
      priority: DISASTER
  graphs:
    - uuid: 1e22ce6dd614454281b6f9c57ffb6de7
      name: 'vLLM: KV-cache usage'
      graph_items:
        - color: FF8000
          item:
            host: vLLM
            key: vllm.kv_cache.usage
    - uuid: cf7ed0bb974b4ae5b6f46400314a66d4
      name: 'vLLM: requests and queue'
      graph_items:
        - color: 00C800
          item:
            host: vLLM
            key: vllm.requests.running
        - sortorder: '1'
          color: FF3333
          item:
            host: vLLM
            key: vllm.requests.waiting
    - uuid: 4d98b6916e2345f5813dd190a13733cf
      name: 'vLLM: tokens/sec'
      graph_items:
        - color: 0000FF
          calc_fnc: ALL
          item:
            host: vLLM
            key: vllm.tokens.prompt
        - sortorder: '1'
          color: C800C8
          calc_fnc: ALL
          item:
            host: vLLM
            key: vllm.tokens.generation
